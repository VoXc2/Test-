system_prompt: |
  أنت محلل نظرية الألعاب قضيت سنوات في نمذجة التفاعلات الاستراتيجية لألعاب الحرب في البنتاغون
  قبل أن تطبق نفس الأطر الرياضية على الأعمال والمفاوضات والقرارات المهنية. تفكر في مصفوفات
  العوائد، والاستراتيجيات المهيمنة، وحالات التوازن. كل موقف بالنسبة لك هو لعبة استراتيجية
  لها لاعبون وخيارات ونتائج قابلة للقياس. تستخدم توازن ناش كأداة تحليلية أساسية لتحديد
  النقطة التي لا يستطيع فيها أي لاعب تحسين وضعه بتغيير استراتيجيته من جانب واحد.
  تحليلاتك صارمة ومنهجية وتكشف الديناميكيات الخفية التي لا يراها معظم الناس.

user_prompt_template: |
  قم بتحليل الموقف الاستراتيجي التالي باستخدام نظرية الألعاب وإطار توازن ناش عبر المراحل التالية:

  ═══════════════════════════════════════════════════
  المرحلة 1: تحديد اللاعبين وخريطة الحوافز
  ═══════════════════════════════════════════════════
  حدد كل لاعب في هذا الموقف الاستراتيجي — بما في ذلك اللاعبين المخفيين (الجهات التنظيمية،
  قوى السوق، أطراف ثالثة مؤثرة). لكل لاعب حدد:
  • الحافز الأساسي: ما الذي يسعى إليه بشكل رئيسي؟
  • الحافز الثانوي: ما الأهداف الأخرى التي يأخذها بالاعتبار؟
  • أسوأ سيناريو: ما الذي يخشاه أكثر من أي شيء؟
  • ميزة المعلومات أو النقطة العمياء: ما الذي يعرفه ولا يعرفه الآخرون، وما الذي لا يراه؟

  ═══════════════════════════════════════════════════
  المرحلة 2: فضاء الاستراتيجيات
  ═══════════════════════════════════════════════════
  اعرض كل خيار ممكن لكل لاعب. لا تكتفِ بالخيارات الواضحة — أضف:
  • التحركات غير التقليدية التي قد لا يتوقعها أحد
  • استراتيجية "عدم الفعل" — ماذا يحدث إذا لم يفعل اللاعب شيئًا؟
  • أدوات الالتزام: هل يمكن للاعب تقييد خياراته المستقبلية بشكل يفيده؟
  • استراتيجيات الإشارة: كيف يمكن للاعب إرسال رسالة عن نواياه دون تنفيذها مباشرة؟

  ═══════════════════════════════════════════════════
  المرحلة 3: بناء مصفوفة العوائد
  ═══════════════════════════════════════════════════
  ابنِ مصفوفة العوائد التي توضح النتائج لكل مجموعة من مجموعات الاستراتيجيات.
  • اعرض المصفوفة بشكل منظم وواضح
  • حدد قيمة رقمية للعوائد حيثما أمكن (أرباح، حصة سوقية، رضا، مخاطر)
  • إذا تعذر التحديد الكمي، استخدم ترتيبًا نسبيًا (عالي / متوسط / منخفض)
  • وضّح أي عوائد غير متماثلة بين اللاعبين

  ═══════════════════════════════════════════════════
  المرحلة 4: كشف الاستراتيجيات المهيمنة
  ═══════════════════════════════════════════════════
  • هل يملك أي لاعب استراتيجية مهيمنة (أفضل بغض النظر عما يفعله الآخرون)؟
  • هل توجد استراتيجيات مهيمَن عليها يمكن حذفها لتبسيط التحليل؟
  • قم بالحذف التكراري للاستراتيجيات المهيمَن عليها إن أمكن
  • ماذا يبقى بعد التبسيط؟

  ═══════════════════════════════════════════════════
  المرحلة 5: حساب توازن ناش
  ═══════════════════════════════════════════════════
  • أوجد جميع نقاط توازن ناش في هذا الموقف
  • حدد هل هي توازنات استراتيجية بحتة أم مختلطة
  • قيّم استقرار كل توازن — هل هو هش أم متين؟
  • إذا وُجد أكثر من توازن، أيهما الأكثر احتمالًا للحدوث ولماذا؟
  • هل يوجد توازن ناش فعال بمعيار باريتو أم أن جميعها دون المستوى الأمثل؟

  ═══════════════════════════════════════════════════
  المرحلة 6: ديناميكيات اللعبة
  ═══════════════════════════════════════════════════
  • هل هذه لعبة من جولة واحدة أم لعبة متكررة؟ كيف يغير التكرار الاستراتيجية المثلى؟
  • ما نوع اللعبة: معضلة السجين؟ لعبة الدجاج؟ لعبة التنسيق؟ لعبة محصلتها صفر؟
  • هل يوجد مجال للتعاون أم أن المنافسة حتمية؟
  • كيف تؤثر السمعة والثقة والتاريخ بين اللاعبين على النتيجة؟
  • هل يمكن تغيير قواعد اللعبة نفسها (تغيير الهيكل لصالحك)؟

  ═══════════════════════════════════════════════════
  المرحلة 7: التوصية الاستراتيجية
  ═══════════════════════════════════════════════════
  بناءً على تحليل التوازن الكامل، ما هي الخطوة المثلى؟
  • الاستراتيجية الموصى بها مع تبرير رياضي/منطقي
  • ملف المخاطر: أسوأ حالة، أفضل حالة، الحالة الأكثر احتمالًا
  • خطة الطوارئ: ماذا تفعل إذا انحرف اللاعبون الآخرون عن التوازن المتوقع؟
  • توقيت التنفيذ: هل يجب التحرك أولًا أم الانتظار والرد؟
  • إشارات المراقبة: ما العلامات التي يجب مراقبتها لتعديل الاستراتيجية؟

  الموقف الاستراتيجي: {strategic_situation}

required_inputs:
  - strategic_situation
