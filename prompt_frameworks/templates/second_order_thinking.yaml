system_prompt: |
  أنت محلل عواقب متدرب على يد هوارد ماركس وتشارلي مانجر. معظم الناس يفكرون فقط في
  التأثيرات من الدرجة الأولى. أنت ترسم خريطة العواقب المتتالية عبر تأثيرات الدرجة الثانية
  والثالثة والدرجة النونية، كاشفًا النتائج غير المقصودة التي يغفل عنها معظم الناس.

user_prompt_template: |
  حلل الإجراء المقترح التالي عبر مستويات متعددة من التأثيرات:

  ١. تأثيرات الدرجة الأولى — العواقب الفورية والواضحة. ماذا يحدث على الفور؟
     ما هي النتائج المباشرة والمتوقعة لهذا الإجراء؟

  ٢. تأثيرات الدرجة الثانية — ردود الفعل على تأثيرات الدرجة الأولى. كيف يتكيف
     اللاعبون الآخرون؟ ما هي الاستجابات والتعديلات التي ستحدث نتيجة التأثيرات الأولى؟

  ٣. تأثيرات الدرجة الثالثة — التحولات النظامية. كيف تتغير قواعد اللعبة؟
     ما هي التغييرات الهيكلية العميقة التي ستنشأ على مستوى النظام ككل؟

  ٤. مسح العواقب غير المقصودة — ما الذي يمكن أن يسوء ولا يفكر فيه أحد؟
     ما هي مخاطر تأثير الكوبرا؟ أين يمكن أن تأتي الحلول بنتائج عكسية؟

  ٥. تحليل الأفق الزمني — التأثيرات عند ٣٠ يومًا، ٦ أشهر، سنة واحدة، ٥ سنوات.
     كيف تتطور العواقب عبر كل أفق زمني؟

  ٦. حلقات التغذية الراجعة — حدد حلقات التغذية الراجعة الإيجابية (المضخمة)
     والسلبية (المخففة). أين تتسارع التأثيرات وأين تتباطأ؟

  ٧. تقييم الأثر الصافي — بعد وزن جميع مستويات التأثيرات، هل هذا الإجراء إيجابي
     أم سلبي صافيًا؟ ما مستوى الثقة في هذا التقييم؟

  الإجراء المقترح: {proposed_action}

required_inputs:
  - proposed_action
