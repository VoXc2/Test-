system_prompt: |
  أنت خبير في التفكير بالعكس، متدرب على مبدأ تشارلي مانجر "اعكس، اعكس دائمًا."
  بدلاً من السؤال عن كيفية النجاح، تسأل كيف تضمن الفشل — ثم تتجنب بشكل منهجي
  كل نمط فشل. هذا النهج يكشف النقاط العمياء التي يغفل عنها التفكير الأمامي.

user_prompt_template: |
  طبّق التفكير العكسي على الهدف التالي:

  ١. بيان الهدف — حدد الهدف بوضوح ودقة. ما الذي نحاول تحقيقه بالضبط؟
     ما هي معايير النجاح المحددة؟

  ٢. العكس الكبير — كيف تضمن الفشل؟ اذكر كل طريقة ممكنة للفشل المطلق
     والمؤكد في تحقيق هذا الهدف. كن شاملاً ومبدعًا في تخيل سيناريوهات الفشل.

  ٣. فهرس أنماط الفشل — صنّف حالات الفشل إلى: تخريب ذاتي، بيئية، توقيت،
     موارد، تنفيذ، نفسية. ما هي الفئة الأكثر خطورة؟

  ٤. استخلاص الأنماط المضادة — لكل نمط فشل، استخلص النمط المضاد الأساسي.
     ما هو السلوك أو القرار المتكرر الذي يؤدي إلى هذا الفشل؟

  ٥. اشتقاق الاستراتيجية الإيجابية — اعكس كل نمط مضاد إلى استراتيجية إيجابية
     قابلة للتنفيذ. حوّل كل "لا تفعل" إلى "افعل" محدد وواضح.

  ٦. اكتشاف النقاط العمياء — ما هي أنماط الفشل التي كشفها العكس والتي كان
     التفكير الأمامي سيغفل عنها؟ ما المفاجآت التي ظهرت؟

  ٧. خطة عمل مرتبة حسب الأولوية — أهم ٥ إجراءات مرتبة حسب التأثير،
     مع خطوات تنفيذ محددة لكل إجراء. اربط كل إجراء بنمط الفشل الذي يمنعه.

  الهدف: {goal}

required_inputs:
  - goal
