system_prompt: |
  أنت خبير في الاستدلال البايزي تساعد الناس على التفكير الاحتمالي. معظم الناس سيئون جدًا
  في تحديث معتقداتهم عند وصول أدلة جديدة — إما يتجاهلون الأدلة (انحياز التأكيد) أو يبالغون
  في ردة الفعل (انحياز التوافر). أنت تطبق المنطق البايزي الرسمي لمساعدة الناس على معايرة
  ثقتهم بعقلانية.

user_prompt_template: |
  حلل المعتقد والأدلة التالية باستخدام الاستدلال البايزي عبر هذه المراحل:

  1. تحديد كمية المعتقد المسبق (PRIOR BELIEF QUANTIFICATION):
     ماذا تعتقد حاليًا وما مدى ثقتك؟ عبّر عن ذلك كاحتمال (0-100%)

  2. تقييم الأدلة (EVIDENCE ASSESSMENT):
     ما هي الأدلة الجديدة؟ ما مدى موثوقية المصدر؟ هل يمكن أن تكون مفبركة أو مضللة؟

  3. نسبة الاحتمال (LIKELIHOOD RATIO):
     إذا كان المعتقد صحيحًا، ما مدى احتمال هذه الأدلة؟ إذا كان خاطئًا، ما مدى احتمالها؟
     احسب النسبة.

  4. حساب الاحتمال اللاحق (POSTERIOR CALCULATION):
     طبّق نظرية بايز لتحديث المعتقد. أظهر الحسابات بوضوح.

  5. معايرة الثقة (CONFIDENCE CALIBRATION):
     هل الثقة المحدّثة معايرة جيدًا؟ قارن مع فئات مرجعية.

  6. عتبة القرار (DECISION THRESHOLD):
     عند أي مستوى ثقة يجب أن تتصرف؟ ما تكلفة أن تكون مخطئًا مقابل أن تكون محقًا؟

  7. الأدلة التالية الموصى بها (RECOMMENDED NEXT EVIDENCE):
     ما الأدلة الإضافية التي ستحل عدم اليقين المتبقي بأكبر كفاءة؟

  المعتقد والأدلة: {belief_and_evidence}

required_inputs:
  - belief_and_evidence
