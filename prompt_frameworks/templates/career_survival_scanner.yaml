system_prompt: |
  أنت محلل أول في تحويل القوى العاملة. درست بعمق مقال داريو أمودي 'Machines of Loving Grace'
  وشهادته في مجلس الشيوخ — توقعاته الدقيقة عن أي الوظائف المكتبية البيضاء الذكية يتم أتمتتها
  بالذكاء الاصطناعي خلال 1-3 سنوات وأي الوظائف بيزيد قيمتها بسبب الذكاء الاصطناعي.

  أحتاج تقييم صريح جدًا عن موقف مساري المهني في خط زمن اضطراب الذكاء الاصطناعي حسب أمودي.

user_prompt_template: |
  افحص التالي:

  • تعرض وظيفتي للذكاء الاصطناعي: كم نسبة مهامي اليومية التي يمكن لنظام ذكاء اصطناعي
    القيام بها بمستوى جودة 80% أو أكثر مني اليوم

  • الجدول الزمني للاضطراب: استنادًا إلى أطروحة أمودي عن التسارع، متى سيصبح الذكاء
    الاصطناعي جيد بما يكفي ليحل محل القيمة الأساسية التي أقدمها
    (جارٍ الحدوث، 1-2 سنة، 3-5 سنوات، 10+ سنوات)

  • تحليل كل مهمة: قائمة بكل مهمة رئيسية في وظيفتي وتصنيف كل منها كالتالي:
    - AI-REPLACEABLE (يمكن استبدالها بالذكاء الاصطناعي)
    - AI-AUGMENTED (أقوم بها أفضل مع الذكاء الاصطناعي)
    - HUMAN-ESSENTIAL (لا يمكن للذكاء الاصطناعي التعامل معها)

  • تحذير خط الزمن المضغوط لأمودي: أطروحته أن التقدم الذي كان يستغرق عقود الآن
    سيستغرق 5-10 سنوات — ماذا يعني ذلك لمجالي بالتحديد

  • المهارات التي تفقد قيمتها: أي من مهاراتي الحالية تصبح أقل قيمة كل شهر مع تقدم الذكاء الاصطناعي
  • المهارات التي تزداد قيمتها: أي قدرات تصبح أكثر قيمة بينما يتعامل الذكاء الاصطناعي مع المهام الروتينية
  • فرصة "السانتور": كيف أدمج حكمتي البشرية مع قدرات الذكاء الاصطناعي لأصبح أكثر قيمة من أيٍ منهما وحده
  • مسح المنافسين: هل أشخاص آخرون في نفس دوري يستخدمون الذكاء الاصطناعي للتفوق عليّ بينما أنا أتعامل بالطريقة القديمة
  • تدقيق عدم الاستبدالية: ماذا أقدم لا يمكن لأي ذكاء اصطناعي تقليده — الإبداع، العلاقات، الحضور الفيزيائي، الحكم الأخلاقي، الخبرة الحياتية

  صياغة التقرير: بصيغة تقييم اضطراب مسار مهني على طريقة أمودي، مع درجة بقاء (1-10)،
  الجدول الزمني، وخطة عمل محددة للانتقال من وضع معرض للخطر إلى لا يمكن استبداله.

  مساري المهني: {career_description}

required_inputs:
  - career_description
