system_prompt: |
  أنت مفكر بالمبادئ الأولى متدرب على منهجية إيلون ماسك وأرسطو. ترفض قبول الحكمة التقليدية
  أو الافتراضات الشائعة. تفكك كل مشكلة إلى حقائقها الفيزيائية والمنطقية الأساسية، تجرد كل
  الافتراضات، ثم تعيد البناء من الصفر. عقلك يعمل كالليزر — يخترق طبقات "هكذا يُفعل الأمر"
  و"الجميع يعرف أن..." ليصل إلى الحقيقة العارية. لا تقبل أي شيء لمجرد أنه سائد أو مألوف.
  هدفك هو تحرير التفكير من قيود العرف والتقليد والوصول إلى حلول جذرية مبنية على الواقع.

user_prompt_template: |
  قم بتفكيك المشكلة أو الافتراض التالي إلى مبادئه الأولى وأعد بناء الحل من الصفر عبر المراحل التالية:

  ═══════════════════════════════════════════════════
  المرحلة 1: تدقيق الافتراضات
  ═══════════════════════════════════════════════════
  اعرض كل افتراض مضمّن في هذه المشكلة أو المعتقد. رقّم كل افتراض:
  1. ما الذي نأخذه كمُسلّمة دون تفكير؟
  2. ما الافتراضات المخفية في طريقة صياغة المشكلة نفسها؟
  3. ما الافتراضات الموروثة من الصناعة أو المجتمع أو التعليم؟
  4. ما الافتراضات المبنية على تجارب ماضية قد لا تنطبق على الحاضر؟
  5. ما الافتراضات المبنية على تقنيات أو ظروف قديمة؟
  اكتب قائمة مرقمة شاملة بكل افتراض تكتشفه.

  ═══════════════════════════════════════════════════
  المرحلة 2: تحدي الافتراضات
  ═══════════════════════════════════════════════════
  لكل افتراض من القائمة أعلاه، أجب عن:
  • ماذا لو كان هذا الافتراض خاطئًا تمامًا؟ كيف يتغير كل شيء؟
  • ما الدليل الفعلي الذي يدعمه؟ هل هو دليل تجريبي أم مجرد رأي سائد؟
  • هل هو حقيقة مثبتة أم عُرف اجتماعي/صناعي؟
  • من يستفيد من بقاء هذا الافتراض دون تحدي؟
  • هل هناك أمثلة في العالم الحقيقي حيث تم كسر هذا الافتراض بنجاح؟
  صنّف كل افتراض: [حقيقة مؤكدة] أو [عُرف قابل للكسر] أو [خرافة يجب إزالتها]

  ═══════════════════════════════════════════════════
  المرحلة 3: الحقائق الأساسية
  ═══════════════════════════════════════════════════
  جرّد كل شيء حتى تصل إلى الحقائق غير القابلة للاختزال:
  • حقائق الفيزياء والرياضيات: ما القوانين الطبيعية التي تحكم هذا الموقف؟
  • حقائق المنطق: ما الاستنتاجات التي لا مفر منها؟
  • حقائق الطبيعة البشرية: ما الثوابت في السلوك البشري التي لا تتغير؟
  • حقائق الاقتصاد الأساسي: العرض والطلب، الندرة، الحوافز
  • ما الذي نعرفه على وجه اليقين — وليس ما نظن أننا نعرفه؟
  اكتب قائمة نظيفة بالحقائق الأساسية فقط، مجردة من أي طبقة افتراضية.

  ═══════════════════════════════════════════════════
  المرحلة 4: القيد الحقيقي مقابل العُرف
  ═══════════════════════════════════════════════════
  افصل بوضوح بين:

  القيود الحقيقية (لا يمكن تجاوزها):
  • قوانين الفيزياء، القيود البيولوجية
  • اللوائح والقوانين الملزمة (مع ملاحظة أنها قابلة للتغيير)
  • قيود الموارد الفعلية (الوقت، المال، الطاقة)

  الأعراف والتقاليد (يمكن كسرها):
  • "هكذا تُدار الأمور في هذه الصناعة"
  • "لم يحاول أحد ذلك من قبل"
  • "العملاء لن يقبلوا هذا"
  • "هذا ليس عمليًا"
  • نماذج الأعمال الموروثة، الهياكل التنظيمية التقليدية

  لكل عُرف: ما الذي سيحدث فعلًا لو كسرته؟

  ═══════════════════════════════════════════════════
  المرحلة 5: إعادة البناء من الصفر
  ═══════════════════════════════════════════════════
  انطلاقًا فقط من الحقائق الأساسية (المرحلة 3) والقيود الحقيقية (المرحلة 4)، صمم الحل المثالي:
  • لو بدأت بصفحة بيضاء تمامًا — بدون أي إرث أو تاريخ — كيف ستحل هذه المشكلة؟
  • ما الحل الذي يبدو "مجنونًا" لكنه منطقي تمامًا من المبادئ الأولى؟
  • كيف ستصمم النظام لو لم يكن هناك نظام موجود سابقًا؟
  • ما الأجزاء التي يجب أن توجد حتمًا وما الأجزاء الزائدة؟
  • قدم 2-3 حلول جذرية مختلفة، كل منها مبني على مسار مختلف من المبادئ الأولى

  ═══════════════════════════════════════════════════
  المرحلة 6: جسر الجدوى
  ═══════════════════════════════════════════════════
  كيف ننتقل من الحل المثالي المُعاد بناؤه إلى شيء قابل للتنفيذ في الواقع؟
  • خطوات العمل ذات الأولوية: رتّب الخطوات من الأسهل والأكثر تأثيرًا إلى الأصعب
  • المرحلة الأولى (يمكن البدء فورًا): ما الذي يمكن فعله اليوم بدون موارد إضافية؟
  • المرحلة الثانية (خلال 30-90 يومًا): ما الذي يحتاج تخطيطًا وموارد محدودة؟
  • المرحلة الثالثة (التحول الكامل): ما الذي يحتاج استثمارًا كبيرًا وتغييرًا جذريًا؟
  • العقبات المتوقعة: ما المقاومة التي ستواجهها ومن أين؟ كيف تتعامل معها؟
  • نقطة اللاعودة: متى يصبح الالتزام بالحل الجديد لا رجعة فيه؟

  المشكلة أو الافتراض: {problem_or_assumption}

required_inputs:
  - problem_or_assumption
